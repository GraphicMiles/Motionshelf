<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tabs example</title><link rel="stylesheet" href="./shadcn-ui.css"></head><body><main class="tabs-demo"><h1 class="sr-only">Tabs example</h1><div class="eyebrow">WORKSPACE</div><div role="tablist" aria-label="Workspace sections" class="tablist"><button type="button" role="tab" id="tab-overview" aria-selected="true" aria-controls="panel-overview" tabindex="0">Overview</button><button type="button" role="tab" id="tab-activity" aria-selected="false" aria-controls="panel-activity" tabindex="-1">Activity</button><button type="button" role="tab" id="tab-settings" aria-selected="false" aria-controls="panel-settings" tabindex="-1">Settings</button></div><section role="tabpanel" id="panel-overview" aria-labelledby="tab-overview" tabindex="0"><span class="panel-icon">◈</span><h2>Everything in one place.</h2><p>Your workspace, ready when you are.</p></section><section role="tabpanel" id="panel-activity" aria-labelledby="tab-activity" tabindex="0" hidden><span class="panel-icon">↗</span><h2>Recent activity</h2><p>Three new updates this week.</p></section><section role="tabpanel" id="panel-settings" aria-labelledby="tab-settings" tabindex="0" hidden><span class="panel-icon">⚙</span><h2>Your preferences</h2><p>Make this space your own.</p></section></main><script src="./shadcn-ui.js" defer></script></body></html>
