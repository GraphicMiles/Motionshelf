<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="./assets/fa/all.min.css"><title>Dialog example</title><link rel="stylesheet" href="./radix-primitives.css"></head><body><main><h1 class="sr-only">Dialog example</h1><div class="profile"><span class="avatar" aria-hidden="true">AM</span><div><strong id="profile-name">Alex Morgan</strong><small>Personal profile</small></div><button id="edit" type="button">Edit profile</button></div><p id="message" role="status" aria-live="polite"></p></main><div class="backdrop" id="backdrop" hidden><section role="dialog" aria-modal="true" aria-labelledby="dialog-title" class="dialog"><button id="close" class="close" aria-label="Close dialog" type="button"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button><span class="eyebrow">ACCOUNT</span><h2 id="dialog-title">Edit profile</h2><p>Change the name shown on your profile.</p><form id="profile-form"><label for="name">Display name</label><input id="name" name="name" maxlength="32" required value="Alex Morgan" autocomplete="off"><div class="actions"><button type="button" id="cancel">Cancel</button><button type="submit" class="save">Save changes</button></div></form></section></div><script src="./radix-primitives.js" defer></script></body></html>
