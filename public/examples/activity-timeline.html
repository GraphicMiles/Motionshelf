<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activity timeline — MotionShelf</title><link rel="stylesheet" href="./activity-timeline.css"></head><body><main class="demo"><div class="frame-bar"><span class="pip" aria-hidden="true"></span><span class="frame-name">Activity timeline</span><span class="frame-tag">grouped</span></div><h1 class="sr-only">Activity timeline</h1><div class="stage">
<div class="al">
  <div class="al-filters" role="group" aria-label="Activity type">
    <button class="al-f" data-type="all" aria-pressed="true">All</button>
    <button class="al-f" data-type="updates" aria-pressed="false">Updates</button>
    <button class="al-f" data-type="comments" aria-pressed="false">Comments</button>
  </div>
  <div class="al-scroll" id="alScroll" tabindex="0" role="region" aria-label="Activity events">
    <ol class="al-list" id="events"></ol>
  </div>
  <button class="al-more" id="more" type="button">Load more</button>
  <p id="status" class="hint" role="status" aria-live="polite"></p>
</div>
</div></main><script src="./activity-timeline.js" defer></script></body></html>
