<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Status dashboard — MotionShelf</title><link rel="stylesheet" href="./status-dashboard.css"></head><body><main class="demo"><div class="frame-bar"><span class="pip" aria-hidden="true"></span><span class="frame-name">Status dashboard</span><span class="frame-tag">live metrics</span></div><h1 class="sr-only">Status dashboard</h1><div class="stage">
<div class="sd">
  <div class="sd-head">
    <span class="sd-live"><span class="sd-ping"></span>Live</span>
    <span class="sd-ts" id="sdTs">updated just now</span>
  </div>
  <div class="sd-metrics" id="sdMetrics"></div>
  <div class="sd-spark" id="sdSpark"></div>
  <div class="sd-actions">
    <button class="btn btn-sm" type="button" id="refresh">Refresh sample</button>
    <button class="btn btn-sm btn-ghost" type="button" id="unavailable">Simulate outage</button>
  </div>
  <p id="status" class="sr-only" role="status" aria-live="polite"></p>
</div>
</div></main><script src="./status-dashboard.js" defer></script></body></html>
